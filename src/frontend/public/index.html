<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0080FF" />
    <meta name="description" content="EcoAlerta — Reporta incidencias medioambientales con fotos geolocalizadas" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Leaflet CSS (Cargado directamente para evitar fallos de Webpack/Tailwind) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Fix: Tailwind preflight rompe las tiles de Leaflet (img max-width:100%, height:auto) -->
    <style>
      .leaflet-tile-pane img,
      .leaflet-marker-pane img,
      .leaflet-shadow-pane img,
      .leaflet-overlay-pane svg {
        max-width: none !important;
        max-height: none !important;
      }
      .leaflet-container img {
        max-width: none !important;
        max-height: none !important;
      }
    </style>
    <title>EcoAlerta — Cuidemos el medio ambiente</title>
  </head>
  <body>
    <noscript>Necesitas activar JavaScript para usar EcoAlerta.</noscript>
    <div id="root"></div>
  </body>
</html>
